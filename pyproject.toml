[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "extraccion-chile"
version = "0.1.0"
description = "Extracción y carga a la capa raw de sismos (USGS) e indicadores económicos (mindicador.cl), orquestada con Airflow."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastián Muñoz" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "psycopg[binary]>=3.2",
]

[project.urls]
Repository = "https://github.com/sebakine/orquestacion-airflow-dbt"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/extraccion"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integracion: necesita PostgreSQL (variable TEST_DATABASE_URL)",
    "airflow: necesita Airflow instalado (se corre dentro de la imagen Docker)",
]

[tool.coverage.run]
branch = true
source = ["extraccion"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/target", "dbt/dbt_packages", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "PERF", "DTZ"]
ignore = ["PLR0913", "PLR2004", "PLR0917", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
