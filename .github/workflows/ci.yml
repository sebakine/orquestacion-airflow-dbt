name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_VERSION: "1.12.7"
  DBT_POSTGRES_VERSION: "1.11.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff format --check src tests dags
      - run: uv run ruff check src tests dags
      - run: uv run mypy

  extraccion-y-dbt:
    name: tests (extracción + dbt contra PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://warehouse:warehouse@localhost:5432/warehouse_test
      DBT_EJECUTABLE: ${{ github.workspace }}/.dbt-venv/bin/dbt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Instalar dbt en su propio entorno
        run: |
          uv venv .dbt-venv
          uv pip install --python .dbt-venv "dbt-core==$DBT_VERSION" "dbt-postgres==$DBT_POSTGRES_VERSION"
      - run: uv run pytest --cov --cov-report=term-missing -m "not airflow"

  dags:
    name: tests (DAGs dentro de la imagen de Airflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t orquestacion-airflow-dbt:ci .
      - name: Cargar los DAGs y validar su estructura
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e AIRFLOW__CORE__DAGS_FOLDER=/repo/dags -e DBT_PROJECT_DIR=/repo/dbt \
            orquestacion-airflow-dbt:ci bash -c \
            "airflow db migrate > /dev/null && pip install -q pytest && python -m pytest -p no:cacheprovider -v tests/test_dags.py"

  docs:
    name: documentación de dbt
    runs-on: ubuntu-latest
    needs: [extraccion-y-dbt]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse" --health-interval 5s --health-retries 10
    env:
      WAREHOUSE_DSN: postgresql://warehouse:warehouse@localhost:5432/warehouse
      DBT_HOST: localhost
      DBT_PASSWORD: warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m extraccion fixtures tests/fixtures
      - name: dbt build y docs
        working-directory: dbt
        run: |
          uv venv ../.dbt-venv
          uv pip install --python ../.dbt-venv "dbt-core==$DBT_VERSION" "dbt-postgres==$DBT_POSTGRES_VERSION"
          ../.dbt-venv/bin/dbt build --profiles-dir .
          ../.dbt-venv/bin/dbt docs generate --profiles-dir . --static
          python scripts/revisar_documentacion.py target
          mkdir -p ../sitio && cp target/static_index.html ../sitio/index.html
