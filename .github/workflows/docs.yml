name: Documentación

# Va aparte del CI para que el badge de CI refleje solo el código.
# Requiere Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DBT_VERSION: "1.12.7"
  DBT_POSTGRES_VERSION: "1.11.0"

jobs:
  docs:
    name: documentación de dbt
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse" --health-interval 5s --health-retries 10
    env:
      WAREHOUSE_DSN: postgresql://warehouse:warehouse@localhost:5432/warehouse
      DBT_HOST: localhost
      DBT_PASSWORD: warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m extraccion fixtures tests/fixtures
      - name: dbt build y docs
        working-directory: dbt
        run: |
          uv venv ../.dbt-venv
          uv pip install --python ../.dbt-venv "dbt-core==$DBT_VERSION" "dbt-postgres==$DBT_POSTGRES_VERSION"
          ../.dbt-venv/bin/dbt build --profiles-dir .
          ../.dbt-venv/bin/dbt docs generate --profiles-dir . --static
          mkdir -p ../sitio && cp target/static_index.html ../sitio/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  verificar-pages:
    name: ¿GitHub Pages está activado?
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      activo: ${{ steps.revisar.outputs.activo }}
    steps:
      - id: revisar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type | grep -qx workflow; then
            echo "activo=true" >> "$GITHUB_OUTPUT"
          else
            echo "activo=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages no está activado. Settings > Pages > Source: GitHub Actions."
          fi

  publicar-docs:
    name: publicar en GitHub Pages
    needs: [docs, verificar-pages]
    if: needs.verificar-pages.outputs.activo == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
