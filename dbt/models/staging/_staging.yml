version: 2

models:
  - name: stg_usgs__sismos
    description: Sismos de USGS con tipos y nombres limpios. Un registro por sismo.
    columns:
      - name: sismo_id
        description: Identificador de USGS, por ejemplo `us6000phap`.
        data_tests:
          - unique
          - not_null
      - name: origen_utc
        description: Hora de origen del sismo.
        data_tests:
          - not_null
          - no_futuro
      - name: actualizado_utc
        description: Última vez que USGS modificó el evento (cambia con cada revisión).
        data_tests:
          - not_null
      - name: magnitud
        description: "{{ doc('col_magnitud') }}"
      - name: tipo_magnitud
        description: "{{ doc('col_tipo_magnitud') }}"
      - name: latitud
        description: "{{ doc('col_latitud') }}"
        data_tests:
          - en_rango:
              arguments:
                minimo: -90
                maximo: 90
      - name: longitud
        description: "{{ doc('col_longitud') }}"
        data_tests:
          - en_rango:
              arguments:
                minimo: -180
                maximo: 180
      - name: profundidad_km
        description: "{{ doc('col_profundidad_km') }}"
      - name: lugar
        description: "{{ doc('col_lugar') }}"
      - name: tipo_evento
        description: earthquake, quarry blast, explosion, etc. Solo los earthquake pasan a los marts.
      - name: estado_revision
        description: >-
          `automatic` cuando lo calculó un algoritmo, `reviewed` cuando lo revisó un sismólogo.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - automatic
                  - reviewed
                  - deleted
      - name: alerta_tsunami
        description: "{{ doc('col_alerta_tsunami') }}"
      - name: reportes_sentido
        description: "{{ doc('col_reportes_sentido') }}"
      - name: significancia
        description: "{{ doc('col_significancia') }}"
      - name: url_usgs
        description: "{{ doc('col_url_usgs') }}"
      - name: cargado_en
        description: "{{ doc('col_cargado_en') }}"

  - name: stg_mindicador__valores
    description: Valores diarios (o mensuales, en el caso de la UTM) de cada indicador.
    data_tests:
      - combinacion_unica:
          arguments:
            columnas:
              - indicador_codigo
              - fecha_original
    columns:
      - name: indicador_codigo
        description: "{{ doc('col_indicador_codigo') }}"
      - name: fecha_original
        description: "{{ doc('col_fecha_original') }}"
      - name: fecha
        description: Fecha en Chile a la que corresponde el valor.
      - name: valor
        description: "{{ doc('col_valor') }}"
      - name: cargado_en
        description: "{{ doc('col_cargado_en') }}"
      - name: es_valido
        description: Falso si la fecha o el valor no se pudieron interpretar.

  - name: stg_mindicador__indicadores
    columns:
      - name: indicador_codigo
        description: "{{ doc('col_indicador_codigo') }}"
        data_tests:
          - unique
          - not_null
      - name: indicador_nombre
        description: "{{ doc('col_indicador_nombre') }}"
      - name: unidad_medida
        description: "{{ doc('col_unidad_medida') }}"
      - name: cargado_en
        description: "{{ doc('col_cargado_en') }}"
    description: Un registro por indicador con su nombre y unidad de medida.
