version: 2

models:
  - name: dim_fecha
    description: Calendario con nombres de mes y día en español.
    columns:
      - name: fecha
        data_tests: [unique, not_null]

  - name: dim_region
    description: Regiones de Chile ordenadas de norte a sur.
    columns:
      - name: region_codigo
        data_tests: [unique, not_null]

  - name: dim_indicador
    description: Indicadores económicos disponibles.
    columns:
      - name: indicador_codigo
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('indicadores_catalogo')
                field: indicador_codigo
              config:
                severity: warn

  - name: fct_sismos
    description: >
      Un sismo por fila. Incremental: solo procesa los sismos nuevos o revisados desde
      la última corrida. Tiene contrato: si cambian el nombre o el tipo de una columna, dbt falla
      antes de romper a quien consume la tabla.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [sismo_id]
    columns:
      - {name: sismo_id, data_type: text, data_tests: [unique, not_null]}
      - name: fecha
        data_type: date
        description: Fecha del sismo en hora de Chile.
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_fecha'), field: fecha}
      - name: region_codigo
        data_type: text
        description: Null si ocurrió fuera de Chile.
        data_tests:
          - relationships:
              arguments: {to: ref('dim_region'), field: region_codigo}
      - {name: origen_utc, data_type: timestamptz}
      - {name: origen_hora_chile, data_type: timestamp}
      - name: magnitud
        data_type: numeric(4, 2)
        data_tests:
          - not_null
          - en_rango:
              arguments: {minimo: 0, maximo: 10}
      - {name: tipo_magnitud, data_type: text}
      - name: categoria
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: [menor, ligero, moderado, fuerte, mayor]
      - name: profundidad_km
        data_type: numeric(7, 2)
        data_tests:
          - en_rango:
              arguments: {minimo: -5, maximo: 800}
      - {name: es_superficial, data_type: boolean}
      - {name: latitud, data_type: "numeric(8, 4)"}
      - {name: longitud, data_type: "numeric(8, 4)"}
      - {name: lugar, data_type: text}
      - {name: ciudad_referencia, data_type: text}
      - {name: pais, data_type: text}
      - {name: distancia_km, data_type: "numeric(6, 1)"}
      - {name: estado_revision, data_type: text}
      - {name: alerta_tsunami, data_type: boolean}
      - {name: reportes_sentido, data_type: integer}
      - {name: url_usgs, data_type: text}
      - {name: actualizado_utc, data_type: timestamptz}
      - name: cargado_en
        data_type: timestamptz
        description: Cuándo llegó esta versión del sismo al warehouse; lo usa la carga incremental.

  - name: fct_indicadores_diarios
    description: Un valor por indicador y día, con la variación porcentual respecto del día anterior.
    data_tests:
      - combinacion_unica:
          arguments:
            columnas: [indicador_codigo, fecha]
    columns:
      - name: indicador_codigo
        data_tests:
          - relationships:
              arguments: {to: ref('dim_indicador'), field: indicador_codigo}
      - name: valor
        data_tests:
          - not_null
          - en_rango:
              arguments: {minimo: 0}
      - name: es_publicado
        description: Falso cuando el valor se arrastró desde el último día publicado.

  - name: mart_sismos_mensuales
    description: Sismos por mes y región, con conteos, magnitud máxima y profundidad promedio.
    data_tests:
      - combinacion_unica:
          arguments:
            columnas: [mes, region]

  - name: mart_resumen_diario
    description: Un día por fila con los indicadores en columnas y la actividad sísmica del día.
    columns:
      - name: fecha
        data_tests: [unique, not_null]

  - name: mart_revisiones_sismos
    description: Sismos que USGS revisó, con la magnitud inicial y la actual.
    columns:
      - name: sismo_id
        data_tests: [unique, not_null]
